<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChiEdgars Lodge · Kasama</title>
    <link rel="icon" type="image/jpeg" href="imgs/logo.jpg">
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Colors from the reference image */
            --bg-body: #F8F9FA;
            --sidebar-bg: #1E2538;
            --sidebar-hover: #2A3349;
            --sidebar-text: #9CA3AF;
            --sidebar-active: #4F46E5;
            --sidebar-active-bg: #4F46E5;
            
            --surface: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #F3F4F6;
            
            --primary: #4F46E5;
            --success: #10B981;
            --success-light: #ECFDF5;
            --warning: #F59E0B;
            --warning-light: #FFFBEB;
            --danger: #EF4444;
            --danger-light: #FEF2F2;
            
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.03), 0 2px 4px -1px rgba(0,0,0,0.02);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================ */
        /* SIDEBAR (DARK)                                               */
        /* ============================================================ */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0; top: 0;
            z-index: 100;
        }

        .brand { 
            display: flex; align-items: center; gap: 12px; 
            margin-bottom: 40px; color: white;
        }
        .brand-logo {
            width: 40px; height: 40px; border-radius: 10px;
            background: white; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
        .brand-text h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .brand-text p { font-size: 11px; color: var(--sidebar-text); font-weight: 500; margin-top: 2px;}

        .nav-menu { display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 16px; border-radius: 12px;
            color: var(--sidebar-text); text-decoration: none;
            font-size: 14px; font-weight: 600; transition: 0.2s;
            cursor: pointer;
        }
        .nav-item i { font-size: 18px; width: 20px; text-align: center; }
        .nav-item:hover { background: var(--sidebar-hover); color: white; }
        .nav-item.active { background: var(--sidebar-active); color: white; }

        /* ============================================================ */
        /* MAIN CONTENT AREA                                            */
        /* ============================================================ */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR */
        .topbar {
            background: var(--surface);
            padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 50;
        }
        .topbar h2 { font-size: 20px; font-weight: 700; color: var(--text-main); }
        
        .topbar-actions { display: flex; align-items: center; gap: 24px; }
        
        .search-bar {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg-body); padding: 10px 16px;
            border-radius: 30px; width: 260px;
        }
        .search-bar i { color: var(--text-muted); font-size: 14px; }
        .search-bar input {
            border: none; background: transparent; outline: none;
            font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text-main); width: 100%;
        }

        .icon-btn {
            background: transparent; border: 1px solid var(--border);
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); cursor: pointer; transition: 0.2s;
        }
        .icon-btn:hover { background: var(--bg-body); color: var(--text-main); }

        .user-profile { display: flex; align-items: center; gap: 12px; }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); }
        .user-info h4 { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .user-info p { font-size: 12px; color: var(--text-muted); font-weight: 500; }

        /* DASHBOARD CONTENT */
        .dashboard-content { padding: 32px 40px; }

        /* STATS GRID */
        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 24px; margin-bottom: 24px;
        }
        .stat-card {
            background: var(--surface); border-radius: 16px;
            padding: 24px; border: 1px solid var(--border);
            box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: center;
        }
        .stat-value { font-size: 28px; font-weight: 800; color: var(--text-main); letter-spacing: -1px; margin-bottom: 12px; }
        .stat-meta { display: flex; align-items: center; gap: 12px; }
        .stat-label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .stat-trend {
            font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 20px;
            display: flex; align-items: center; gap: 4px;
        }
        .trend-up { background: var(--success-light); color: var(--success); }
        .trend-down { background: var(--danger-light); color: var(--danger); }

        /* MAIN LAYOUT GRID */
        .layout-grid {
            display: grid; grid-template-columns: 2fr 1fr; gap: 24px;
        }

        .card {
            background: var(--surface); border-radius: 16px;
            padding: 24px; border: 1px solid var(--border);
            box-shadow: var(--shadow-sm); margin-bottom: 24px;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .card-title { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .chip {
            background: var(--bg-body); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--text-muted);
            display: flex; align-items: center; gap: 6px;
        }

        /* TABLE */
        .table-wrap { overflow-x: auto; }
        .guest-table { width: 100%; border-collapse: collapse; }
        .guest-table th {
            text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600;
            color: var(--text-muted); border-bottom: 1px solid var(--border);
        }
        .guest-table th:first-child { padding-left: 0; }
        .guest-table td {
            padding: 16px; border-bottom: 1px solid var(--border);
            font-size: 14px; font-weight: 600; color: var(--text-main);
        }
        .guest-table td:first-child { padding-left: 0; }
        .guest-table tr:last-child td { border-bottom: none; }
        
        .guest-cell { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: white;
        }
        .avatar.a0 { background: #6366F1; } .avatar.a1 { background: #10B981; }
        .avatar.a2 { background: #F59E0B; } .avatar.a3 { background: #EC4899; }
        .avatar.a4 { background: #06B6D4; } .avatar.a5 { background: #8B5CF6; }

        .status-badge {
            font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .status-active { background: var(--success-light); color: var(--success); }
        .status-inactive { background: var(--bg-body); color: var(--text-muted); }

        .btn-icon {
            background: transparent; border: none; color: var(--text-muted);
            width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .btn-icon:hover { background: var(--danger-light); color: var(--danger); }

        /* ROOMS GRID */
        .rooms-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px; max-height: 380px; overflow-y: auto; padding-right: 4px;
        }
        .rooms-grid::-webkit-scrollbar { width: 4px; }
        .rooms-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        
        .room-item {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
            transition: 0.2s;
        }
        .room-item:hover { border-color: var(--primary); box-shadow: var(--shadow-sm); }
        .room-item.vacant { border-left: 4px solid var(--success); }
        .room-item.occupied { border-left: 4px solid var(--warning); }
        
        .room-top { display: flex; justify-content: space-between; align-items: center; }
        .room-num { font-size: 14px; font-weight: 800; color: var(--text-main); }
        .room-dot { width: 6px; height: 6px; border-radius: 50%; }
        .vacant .room-dot { background: var(--success); }
        .occupied .room-dot { background: var(--warning); }
        
        .room-guest { font-size: 11px; font-weight: 600; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .room-status { font-size: 10px; font-weight: 700; text-align: center; padding: 4px; border-radius: 6px; }
        .vacant .room-status { background: var(--success-light); color: var(--success); }
        .occupied .room-status { background: var(--warning-light); color: var(--warning); }

        /* FORMS */
        .add-guest-form { display: flex; flex-direction: column; gap: 16px; }
        .form-row { display: flex; gap: 16px; }
        .form-group { flex: 1; }
        .form-group label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; display: block; }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px 12px 40px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--bg-body);
            font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text-main);
            outline: none; transition: 0.2s;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); background: white; }
        
        .btn-add {
            background: var(--primary); color: white; border: none;
            padding: 14px; border-radius: 10px; font-family: inherit;
            font-size: 14px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
        }
        .btn-add:hover { background: #4338CA; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }

        /* ACTION BUTTONS */
        .action-btn {
            display: flex; align-items: center; gap: 12px; width: 100%;
            background: var(--bg-body); border: 1px solid var(--border);
            padding: 14px; border-radius: 12px; cursor: pointer; transition: 0.2s;
            text-align: left; font-family: inherit; margin-bottom: 12px;
        }
        .action-btn:hover { border-color: var(--primary); background: white; }
        .action-icon {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px;
        }
        .bg-red { background: var(--danger); }
        .bg-blue { background: var(--primary); }
        .action-text { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .action-text small { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); margin-top: 2px; }

        /* TOAST & UTILS */
        #toast {
            position: fixed; bottom: 30px; right: 30px; background: var(--text-main); color: white;
            padding: 16px 24px; border-radius: 12px; font-size: 14px; font-weight: 600;
            box-shadow: var(--shadow-lg); transform: translateY(200%); transition: 0.3s;
            z-index: 999; display: flex; align-items: center; gap: 10px;
        }
        #toast.show { transform: translateY(0); }
        #toast.error { background: var(--danger); }
        #toast.success { background: var(--success); }

        .loading-overlay {
            position: fixed; inset: 0; background: rgba(248, 249, 250, 0.8);
            backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
            z-index: 998; font-size: 32px; color: var(--primary);
        }
        .hidden { display: none !important; }

        /* Mobile Adjustments */
        @media (max-width: 1024px) {
            .layout-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .sidebar { display: none; } /* Hide sidebar on mobile */
            .main-content { margin-left: 0; }
            .topbar { padding: 16px 20px; }
            .search-bar { display: none; }
            .dashboard-content { padding: 20px; }
            .stats-grid { grid-template-columns: 1fr; }
            .form-row { flex-direction: column; gap: 12px; }
        }
    </style>
</head>

<div class="main-content">

                <div class="card">

                        <button class="btn-add" id="addGuestBtn">
                            <i class="fas fa-check-circle"></i> Confirm Check-In

            </div>

            <!-- RIGHT COLUMN (Rooms & Actions) -->
            <div class="right-col">
                <!-- ROOM GRID -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Room Status</div>
                        <div class="chip" id="roomSummaryBadge">0 Vacant</div>
                    </div>
                    <div class="rooms-grid" id="roomsGrid"></div>
                    <div style="display: flex; gap: 16px; margin-top: 16px; font-size: 12px; font-weight: 600; color: var(--text-muted);">

        </div>
    </div>
</div>

    const SUPABASE_URL = 'https://vokfonpslvruqrrrzjzh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZva2ZvbnBzbHZydXFycnJ6anpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTI3MTEsImV4cCI6MjEwNTkyODcxMX0.aoXjKuUYPzduqxoj54fvUANF7yZ1zqS9wq1eKtXnRVw';

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function() {
    'use strict';

    let supabase = null;
    let rooms = [];
    let guests = [];

    function initSupabase() {
        if (SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_ANON_KEY.includes('YOUR-ANON')) {
            showToast('⚠️ Add your Supabase URL and key first', 'error', 8000);
            return false;
        }
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        return true;
    }

    function showToast(msg, type = 'success', duration = 3000) {
        const el = document.getElementById('toast');
        el.innerHTML = (type === 'success' ? '<i class="fas fa-check-circle"></i> ' : '<i class="fas fa-circle-exclamation"></i> ') + msg;
        el.className = 'show ' + (type === 'error' ? 'error' : 'success');
        setTimeout(() => { el.className = ''; }, duration);
    }

    function setLoading(on) {
        document.getElementById('loading').classList.toggle('hidden', !on);
    }

    function formatDate(date) {
        if (!date) return '';
        const d = new Date(date);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }
    function today() { return formatDate(new Date()); }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function initials(name) {
        if (!name) return '?';
        const parts = name.trim().split(/\s+/);
        return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
    }
    
    function colorFor(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 6;
        return 'a' + h;
    }

    async function loadAll() {
        if (!supabase && !initSupabase()) return;
        setLoading(true);
        try {
            const [roomsRes, guestsRes] = await Promise.all([
                supabase.from('rooms').select('*').order('id'),
                supabase.from('guests').select('*').order('created_at', { ascending: false })
            ]);
            
            if (roomsRes.error) throw roomsRes.error;
            if (guestsRes.error) throw guestsRes.error;
            
            rooms = roomsRes.data || [];
            guests = guestsRes.data || [];
            renderAll();
        } catch (err) {
            console.error(err);
            showToast('Failed to load: ' + err.message, 'error', 5000);
        } finally {
            setLoading(false);
        }
    }

    function renderAll() {
        renderStats();
        renderGuestTable();
        renderRooms();
        renderRoomSelect();
        updateBadges();
    }

    function renderStats() {
        const active = guests.filter(g => g.still_lodging).length;
        const totalPaid = guests.reduce((s, g) => s + (Number(g.amount_paid) || 0), 0);
        const vacant = rooms.filter(r => !r.is_occupied).length;
        const occupied = rooms.length - vacant;
        const rate = rooms.length ? Math.round((occupied / rooms.length) * 100) : 0;

        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card">
                <div class="stat-value">ZMW ${totalPaid.toLocaleString()}</div>
                <div class="stat-meta">
                    <span class="stat-label">Total Revenue</span>
                    <span class="stat-trend trend-up"><i class="fas fa-arrow-up"></i> Live</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${active}</div>
                <div class="stat-meta">
                    <span class="stat-label">Guests in House</span>
                    <span class="stat-trend trend-up"><i class="fas fa-arrow-up"></i> Active</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${rate}%</div>
                <div class="stat-meta">
                    <span class="stat-label">Occupancy Rate</span>
                    <span class="stat-trend ${rate > 50 ? 'trend-up' : 'trend-down'}">
                        <i class="fas fa-arrow-${rate > 50 ? 'up' : 'down'}"></i> ${vacant} vacant
                    </span>
                </div>
            </div>
        `;
    }

    function renderGuestTable() {
        const tbody = document.getElementById('guestTableBody');
        if (!guests.length) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 24px; color: var(--text-muted);">No active guests found.</td></tr>';
            return;
        }

        const sorted = [...guests].sort((a, b) => {
            if (a.still_lodging === b.still_lodging) return 0;
            return a.still_lodging ? -1 : 1;
        });

        tbody.innerHTML = sorted.map(g => {
            const room = rooms.find(r => r.id === g.room_id);
            const roomName = room ? room.name : '—';
            const statusClass = g.still_lodging ? 'status-active' : 'status-inactive';
            const statusText = g.still_lodging ? 'Lodging' : 'Checked Out';
            const av = colorFor(g.name || 'x');
            
            return `<tr>
                <td>
                    <div class="guest-cell">
                        <div class="avatar ${av}">${initials(g.name)}</div>
                        <div>
                            <div style="font-weight: 700; color: var(--text-main);">${escapeHtml(g.name)}</div>
                        </div>
                    </div>
                </td>
                <td><span style="background: var(--bg-body); padding: 4px 8px; border-radius: 6px; font-size: 12px;">${roomName}</span></td>
                <td>${g.check_in || '—'}</td>
                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                <td>ZMW ${Number(g.amount_paid).toLocaleString()}</td>
                <td>
                    ${g.still_lodging ? `<button class="btn-icon" onclick="checkoutGuest(${g.id})" title="Check out"><i class="fas fa-arrow-right-from-bracket"></i></button>` : ''}
                </td>
            </tr>`;
        }).join('');
    }

    function renderRooms() {
        const grid = document.getElementById('roomsGrid');
        if (!rooms.length) {
            grid.innerHTML = '<div style="text-align:center; padding: 20px; font-size: 13px; color: var(--text-muted);">No rooms configured.</div>';
            return;
        }
        
        grid.innerHTML = rooms.map(room => {
            const occ = room.is_occupied;
            const occupant = occ ? guests.find(g => g.room_id === room.id && g.still_lodging) : null;
            const guestName = occupant ? escapeHtml(occupant.name.split(' ')[0]) : 'Available';
            
            return `<div class="room-item ${occ ? 'occupied' : 'vacant'}">
                <div class="room-top">
                    <span class="room-num">${escapeHtml(room.name.replace('Room ',''))}</span>
                    <span class="room-dot"></span>
                </div>
                <div class="room-guest">${guestName}</div>
                <div class="room-status">${occ ? 'Occupied' : 'Vacant'}</div>
            </div>`;
        }).join('');
        
        const vacant = rooms.filter(r => !r.is_occupied).length;
        document.getElementById('roomSummaryBadge').textContent = `${vacant} Vacant`;
    }

    function renderRoomSelect() {
        const select = document.getElementById('roomSelect');
        const vacant = rooms.filter(r => !r.is_occupied);
        if (!vacant.length) {
            select.innerHTML = '<option value="">No rooms available</option>';
            select.disabled = true;
            return;
        }
        select.disabled = false;
        select.innerHTML = vacant.sort((a, b) => a.id - b.id)
            .map(r => `<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('');
    }

    function updateBadges() {
        const active = guests.filter(g => g.still_lodging).length;
        document.getElementById('guestCountBadge').textContent = `${active} Active`;
    }

    window.addGuest = async function() {
        if (!supabase) return;
        const name = document.getElementById('guestNameInput').value.trim();
        const roomId = document.getElementById('roomSelect').value;
        const checkIn = document.getElementById('checkInDate').value;
        const amount = parseFloat(document.getElementById('amountPaidInput').value) || 0;

        if (!name) return showToast('Please enter guest name', 'error');
        if (!roomId) return showToast('No vacant room selected', 'error');
        if (!checkIn) return showToast('Please pick check‑in date', 'error');

        setLoading(true);
        try {
            const { error: e1 } = await supabase.from('guests').insert({
                name, room_id: Number(roomId), check_in: checkIn,
                amount_paid: amount, still_lodging: true
            });
            if (e1) throw e1;

            const { error: e2 } = await supabase
                .from('rooms').update({ is_occupied: true }).eq('id', Number(roomId));
            if (e2) throw e2;

            document.getElementById('guestNameInput').value = '';
            document.getElementById('amountPaidInput').value = '500';
            showToast('Guest checked in!');
            await loadAll();
        } catch (err) {
            console.error(err);
            showToast(err.message, 'error');
        } finally {
            setLoading(false);
        }
    };

    window.checkoutGuest = async function(guestId) {
        if (!supabase) return;
        if (!confirm('Check out this guest?')) return;
        const guest = guests.find(g => g.id === guestId);
        if (!guest) return;

        setLoading(true);
        try {
            const { error: e1 } = await supabase.from('guests')
                .update({ still_lodging: false, check_out: today() }).eq('id', guestId);
            if (e1) throw e1;

            if (guest.room_id) {
                const { error: e2 } = await supabase.from('rooms')
                    .update({ is_occupied: false }).eq('id', guest.room_id);
                if (e2) throw e2;
            }
            showToast('Guest checked out');
            await loadAll();
        } catch (err) {
            console.error(err);
            showToast(err.message, 'error');
        } finally {
            setLoading(false);
        }
    };

    window.markAllCheckedOut = async function() {
        if (!supabase) return;
        const active = guests.filter(g => g.still_lodging);
        if (!active.length) return showToast('No active guests', 'error');
        if (!confirm(`Check out all ${active.length} guest(s)?`)) return;

        setLoading(true);
        try {
            const { error: e1 } = await supabase.from('guests')
                .update({ still_lodging: false, check_out: today() }).eq('still_lodging', true);
            if (e1) throw e1;

            const { error: e2 } = await supabase.from('rooms')
                .update({ is_occupied: false }).eq('is_occupied', true);
            if (e2) throw e2;

            showToast('All guests checked out');
            await loadAll();
        } catch (err) {
            console.error(err);
            showToast(err.message, 'error');
        } finally {
            setLoading(false);
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('checkInDate').value = today();
        document.getElementById('addGuestBtn').addEventListener('click', addGuest);

        if (initSupabase()) {
            loadAll();
        }
    });
})();
</script>
</body>
</html>
