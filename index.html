<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChiEdgars Lodge · Kasama</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6fb;
            color: #1e293b;
            padding: 24px;
            min-height: 100vh;
        }
        .dashboard { max-width: 1440px; margin: 0 auto; }

        /* HEADER */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 28px; flex-wrap: wrap; gap: 16px;
        }
        .header-left h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600; font-size: 28px; letter-spacing: -0.3px;
            color: #0f172a; display: flex; align-items: center; gap: 10px;
        }
        .header-left h1 i {
            color: #3b82f6; background: #e6edfc;
            padding: 8px 10px; border-radius: 14px; font-size: 22px;
        }
        .badge-lodge {
            background: #dbeafe; color: #1d4ed8;
            font-size: 14px; font-weight: 600;
            padding: 4px 12px; border-radius: 30px;
            margin-left: 12px;
        }
        .header-right { display: flex; gap: 12px; }
        .btn {
            border: none; background: white; padding: 10px 18px;
            border-radius: 40px; font-weight: 600; font-size: 14px;
            display: inline-flex; align-items: center; gap: 8px;
            cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: 0.2s ease; border: 1px solid #e2e8f0; color: #1e293b;
        }
        .btn-primary {
            background: #1e293b; color: white;
            border: 1px solid #1e293b;
            box-shadow: 0 8px 16px -6px rgba(15,23,42,0.2);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -8px rgba(0,0,0,0.15); }
        .btn-primary:hover { background: #0f172a; }

        /* STATS */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-bottom: 28px;
        }
        .stat-card {
            background: white; border-radius: 26px; padding: 20px 22px;
            box-shadow: 0 8px 20px -6px rgba(0,0,0,0.04);
            border: 1px solid #eef2f6;
            display: flex; align-items: center; justify-content: space-between;
        }
        .stat-info h3 { font-size: 15px; font-weight: 500; color: #64748b; margin-bottom: 6px; }
        .stat-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 34px; font-weight: 600; color: #0f172a; line-height: 1.1;
        }
        .stat-icon {
            width: 52px; height: 52px; background: #f1f5f9;
            border-radius: 18px; display: flex; align-items: center;
            justify-content: center; font-size: 24px; color: #3b82f6;
        }

        /* LAYOUT */
        .main-panel { display: flex; gap: 24px; flex-wrap: wrap; }
        .left-section { flex: 2.2; min-width: 320px; }
        .right-section { flex: 1.2; min-width: 280px; }

        .card {
            background: white; border-radius: 28px; padding: 22px 20px;
            box-shadow: 0 8px 24px -10px rgba(0,0,0,0.04);
            border: 1px solid #edf2f7; margin-bottom: 24px;
        }
        .card-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 18px;
        }
        .card-header h2 {
            font-size: 18px; font-weight: 600;
            display: flex; align-items: center; gap: 8px; color: #0f172a;
        }
        .card-header h2 i { color: #3b82f6; font-size: 18px; }
        .small-badge {
            background: #eef2f6; font-size: 12px; font-weight: 600;
            padding: 4px 10px; border-radius: 40px; color: #475569;
        }

        /* TABLE */
        .guest-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .guest-table th {
            text-align: left; padding: 10px 6px 10px 0;
            font-weight: 600; color: #64748b; font-size: 12px;
            text-transform: uppercase; letter-spacing: 0.4px;
            border-bottom: 1px solid #e9eef3;
        }
        .guest-table td {
            padding: 14px 6px 14px 0;
            border-bottom: 1px solid #f1f6fa;
            color: #1e293b; font-weight: 500;
        }
        .guest-table tr:last-child td { border-bottom: none; }
        .status-badge {
            display: inline-flex; align-items: center; gap: 5px;
            background: #dcfce7; color: #15803d;
            font-size: 12px; font-weight: 600;
            padding: 4px 10px; border-radius: 30px;
        }
        .status-badge.checked-out { background: #f1f5f9; color: #475569; }
        .amount { font-weight: 700; color: #0f172a; }
        .btn-icon {
            background: transparent; border: none; color: #94a3b8;
            font-size: 16px; cursor: pointer; padding: 6px 8px;
            border-radius: 12px; transition: 0.15s;
        }
        .btn-icon:hover { background: #f1f5f9; color: #1e293b; }

        /* ROOMS — grid auto-fits 30 rooms nicely */
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .room-item {
            background: #f9fbfd; border-radius: 16px;
            padding: 10px 12px;
            display: flex; flex-direction: column;
            gap: 6px;
            border: 1px solid #e9f0f5;
            transition: 0.15s;
        }
        .room-item:hover { transform: translateY(-2px); box-shadow: 0 6px 14px -6px rgba(0,0,0,0.08); }
        .room-item.vacant { border-left: 5px solid #22c55e; background: #f0fdf4; }
        .room-item.occupied { border-left: 5px solid #f97316; background: #fff7ed; }
        .room-number {
            font-weight: 700; font-size: 14px; color: #0f172a;
            display: flex; align-items: center; justify-content: space-between;
        }
        .room-number i { font-size: 11px; color: #94a3b8; }
        .room-guest {
            font-size: 11px; color: #64748b;
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis;
            min-height: 14px;
        }
        .room-status {
            font-size: 11px; font-weight: 600;
            padding: 3px 8px; border-radius: 20px;
            background: white;
            text-align: center;
        }
        .vacant .room-status { color: #15803d; }
        .occupied .room-status { color: #b45309; }
        .room-legend {
            display: flex; gap: 18px; margin-top: 16px;
            font-size: 13px; color: #475569; align-items: center;
        }
        .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 4px; margin-right: 6px; }
        .legend-dot.green { background: #22c55e; }
        .legend-dot.orange { background: #f97316; }

        /* FORM */
        .add-guest-form { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 120px; }
        .form-group label {
            font-size: 12px; font-weight: 600; color: #64748b;
            margin-bottom: 4px; display: block;
        }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px; border-radius: 16px;
            border: 1px solid #e2e8f0; background: #fbfdff;
            font-size: 14px; font-family: 'Inter', sans-serif;
            font-weight: 500; color: #0f172a; outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
            background: white;
        }
        .btn-add {
            background: #1e293b; color: white; border: none;
            padding: 14px 18px; border-radius: 40px;
            font-weight: 600; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            gap: 10px; cursor: pointer; margin-top: 6px; width: 100%;
        }
        .btn-add:hover { background: #0f172a; }
        .btn-add:disabled { opacity: 0.6; cursor: not-allowed; }

        .text-muted { color: #64748b; font-size: 13px; }
        .mt-2 { margin-top: 10px; }

        /* TOAST */
        #toast {
            position: fixed; bottom: 30px; right: 30px;
            background: #1e293b; color: white;
            padding: 14px 22px; border-radius: 14px;
            font-size: 14px; font-weight: 500;
            box-shadow: 0 10px 30px -8px rgba(0,0,0,0.3);
            transform: translateY(200%); transition: transform 0.3s;
            z-index: 999; max-width: 340px;
        }
        #toast.show { transform: translateY(0); }
        #toast.error { background: #dc2626; }
        #toast.success { background: #15803d; }

        /* LOADING */
        .loading-overlay {
            position: fixed; inset: 0; background: rgba(244,246,251,0.8);
            display: flex; align-items: center; justify-content: center;
            z-index: 998; font-size: 40px; color: #3b82f6;
        }
        .hidden { display: none !important; }

        @media (max-width: 700px) {
            body { padding: 16px; }
            .header-left h1 { font-size: 22px; }
            .stat-value { font-size: 28px; }
            .rooms-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="header">
        <div class="header-left">
            <h1>
                <i class="fas fa-hotel"></i> ChiEdgars
                <span class="badge-lodge"><i class="fas fa-map-pin"></i> Kasama</span>
            </h1>
            <div class="text-muted" style="margin-top: 6px; margin-left: 6px;">
                <i class="far fa-calendar-alt"></i> Today · <span id="currentDate"></span>
            </div>
        </div>
        <div class="header-right">
            <button class="btn" onclick="loadAll()"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button class="btn btn-primary" onclick="showConfigHelp()"><i class="fas fa-gear"></i> Config</button>
        </div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="main-panel">
        <div class="left-section">
            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-users"></i> Guests & Stays</h2>
                    <span class="small-badge" id="guestCountBadge">0 active</span>
                </div>
                <div style="overflow-x: auto;">
                    <table class="guest-table">
                        <thead>
                            <tr>
                                <th>Guest</th>
                                <th>Lodge In</th>
                                <th>Lodge Out</th>
                                <th>Status</th>
                                <th>Amount (ZMW)</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="guestTableBody"></tbody>
                    </table>
                </div>
                <div class="text-muted mt-2" id="emptyGuestMsg" style="display:none;">
                    <i class="fas fa-circle-check" style="color:#22c55e;"></i> No guests yet. Add one below.
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-user-plus"></i> New guest</h2>
                    <span class="small-badge">quick check‑in</span>
                </div>
                <div class="add-guest-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Guest name</label>
                            <input type="text" id="guestNameInput" placeholder="e.g. Chanda M.">
                        </div>
                        <div class="form-group">
                            <label>Room number</label>
                            <select id="roomSelect"></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Check‑in date</label>
                            <input type="date" id="checkInDate">
                        </div>
                        <div class="form-group">
                            <label>Amount paid (ZMW)</label>
                            <input type="number" id="amountPaidInput" placeholder="0" min="0" step="10" value="500">
                        </div>
                    </div>
                    <button class="btn-add" id="addGuestBtn"><i class="fas fa-check-circle"></i> Check‑in guest</button>
                </div>
            </div>
        </div>

        <div class="right-section">
            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-door-open"></i> Rooms (1–30)</h2>
                    <span class="small-badge" id="roomSummaryBadge">0 vacant</span>
                </div>
                <div class="rooms-grid" id="roomsGrid"></div>
                <div class="room-legend">
                    <span><span class="legend-dot green"></span> Vacant</span>
                    <span><span class="legend-dot orange"></span> Occupied</span>
                </div>
            </div>

            <div class="card" style="background:#eef6ff; border:1px solid #d9e9ff;">
                <h2 style="font-size:16px;"><i class="fas fa-lightbulb"></i> Quick actions</h2>
                <div style="margin-top:16px; display:flex; flex-direction:column; gap:10px;">
                    <button class="btn" style="justify-content:flex-start;" onclick="markAllCheckedOut()">
                        <i class="fas fa-right-from-bracket"></i> Check‑out all guests
                    </button>
                    <button class="btn" style="justify-content:flex-start;" onclick="loadAll()">
                        <i class="fas fa-rotate"></i> Reload from database
                    </button>
                    <div class="text-muted" style="font-size:12px; margin-top:8px;">
                        <i class="fas fa-database"></i> Data stored in Supabase
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>
<div id="loading" class="loading-overlay hidden"><i class="fas fa-spinner fa-spin"></i></div>

<!-- ============================================================= -->
<!-- STEP 1: REPLACE THESE WITH YOUR SUPABASE CREDENTIALS          -->
<!-- Get them from: Supabase Dashboard → Project Settings → API    -->
<!-- ============================================================= -->
<script>
    // 🔴 REPLACE THESE TWO LINES WITH YOUR ACTUAL SUPABASE VALUES
    const SUPABASE_URL = 'https://YOUR-PROJECT-REF.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';
</script>

<!-- Supabase client from CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function() {
    'use strict';

    // ---------- INIT ----------
    let supabase = null;
    let rooms = [];
    let guests = [];

    function initSupabase() {
        if (SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_ANON_KEY.includes('YOUR-ANON')) {
            showToast('⚠️ Add your Supabase URL and key first', 'error', 8000);
            showConfigHelp();
            return false;
        }
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        return true;
    }

    // ---------- UI HELPERS ----------
    function showToast(msg, type = 'success', duration = 3000) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'show ' + (type === 'error' ? 'error' : 'success');
        setTimeout(() => { el.className = ''; }, duration);
    }

    function setLoading(on) {
        document.getElementById('loading').classList.toggle('hidden', !on);
    }

    function formatDate(date) {
        if (!date) return '';
        const d = new Date(date);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function today() { return formatDate(new Date()); }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ---------- LOAD ----------
    async function loadAll() {
        if (!supabase && !initSupabase()) return;
        setLoading(true);
        try {
            const [roomsRes, guestsRes] = await Promise.all([
                supabase.from('rooms').select('*').order('id'),
                supabase.from('guests').select('*').order('created_at', { ascending: false })
            ]);

            if (roomsRes.error) throw roomsRes.error;
            if (guestsRes.error) throw guestsRes.error;

            rooms = roomsRes.data || [];
            guests = guestsRes.data || [];
            renderAll();
        } catch (err) {
            console.error(err);
            showToast('❌ Failed to load: ' + err.message, 'error', 5000);
        } finally {
            setLoading(false);
        }
    }

    // ---------- RENDER ----------
    function renderAll() {
        renderStats();
        renderGuestTable();
        renderRooms();
        renderRoomSelect();
        updateBadges();
    }

    function renderStats() {
        const active = guests.filter(g => g.still_lodging).length;
        const totalPaid = guests.reduce((s, g) => s + (Number(g.amount_paid) || 0), 0);
        const vacant = rooms.filter(r => !r.is_occupied).length;
        const occupied = rooms.length - vacant;

        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Guests in house</h3>
                    <div class="stat-value">${active}</div>
                </div>
                <div class="stat-icon"><i class="fas fa-user-check"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Total revenue</h3>
                    <div class="stat-value">ZMW ${totalPaid.toLocaleString()}</div>
                </div>
                <div class="stat-icon"><i class="fas fa-coins"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Vacant rooms</h3>
                    <div class="stat-value">${vacant}</div>
                </div>
                <div class="stat-icon"><i class="fas fa-door-closed"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Occupied</h3>
                    <div class="stat-value">${occupied}</div>
                </div>
                <div class="stat-icon"><i class="fas fa-door-open"></i></div>
            </div>
        `;
    }

    function renderGuestTable() {
        const tbody = document.getElementById('guestTableBody');
        const emptyMsg = document.getElementById('emptyGuestMsg');

        if (!guests.length) {
            tbody.innerHTML = '';
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';

        const sorted = [...guests].sort((a, b) => {
            if (a.still_lodging === b.still_lodging) return 0;
            return a.still_lodging ? -1 : 1;
        });

        tbody.innerHTML = sorted.map(g => {
            const room = rooms.find(r => r.id === g.room_id);
            const roomName = room ? room.name : '—';
            const statusClass = g.still_lodging ? 'status-badge' : 'status-badge checked-out';
            const statusText = g.still_lodging
                ? '<i class="fas fa-circle"></i> Lodging'
                : '<i class="fas fa-check-circle"></i> Checked out';
            return `<tr>
                <td><strong>${escapeHtml(g.name)}</strong><br>
                    <span class="text-muted" style="font-size:12px;">${roomName}</span></td>
                <td>${g.check_in || '—'}</td>
                <td>${g.check_out || '—'}</td>
                <td><span class="${statusClass}">${statusText}</span></td>
                <td class="amount">${Number(g.amount_paid).toLocaleString()}</td>
                <td>
                    ${g.still_lodging ? `<button class="btn-icon" onclick="checkoutGuest(${g.id})" title="Check out"><i class="fas fa-sign-out-alt"></i></button>` : ''}
                </td>
            </tr>`;
        }).join('');
    }

    function renderRooms() {
        const grid = document.getElementById('roomsGrid');
        if (!rooms.length) {
            grid.innerHTML = '<div class="text-muted" style="grid-column:1/-1;text-align:center;padding:20px;">No rooms in database.</div>';
            return;
        }
        grid.innerHTML = rooms.map(room => {
            const occ = room.is_occupied;
            const occupant = occ ? guests.find(g => g.room_id === room.id && g.still_lodging) : null;
            const guestName = occupant ? escapeHtml(occupant.name.split(' ')[0]) : '—';
            return `<div class="room-item ${occ ? 'occupied' : 'vacant'}">
                <div class="room-number">
                    <span>${escapeHtml(room.name)}</span>
                    <i class="fas fa-door-${occ ? 'open' : 'closed'}"></i>
                </div>
                <div class="room-guest">${guestName}</div>
                <div class="room-status">${occ ? 'Occupied' : 'Vacant'}</div>
            </div>`;
        }).join('');

        const vacant = rooms.filter(r => !r.is_occupied).length;
        document.getElementById('roomSummaryBadge').textContent = `${vacant} vacant / ${rooms.length}`;
    }

    function renderRoomSelect() {
        const select = document.getElementById('roomSelect');
        const vacant = rooms.filter(r => !r.is_occupied);

        if (!vacant.length) {
            select.innerHTML = '<option value="">-- No vacant rooms --</option>';
            select.disabled = true;
            return;
        }
        select.disabled = false;

        // Group by numeric order (Room 1 → Room 30)
        select.innerHTML = vacant
            .sort((a, b) => a.id - b.id)
            .map(r => `<option value="${r.id}">${escapeHtml(r.name)}</option>`)
            .join('');
    }

    function updateBadges() {
        const active = guests.filter(g => g.still_lodging).length;
        document.getElementById('guestCountBadge').textContent = `${active} active`;
    }

    // ---------- ACTIONS ----------
    window.addGuest = async function() {
        if (!supabase) return;
        const name = document.getElementById('guestNameInput').value.trim();
        const roomId = document.getElementById('roomSelect').value;
        const checkIn = document.getElementById('checkInDate').value;
        const amount = parseFloat(document.getElementById('amountPaidInput').value) || 0;

        if (!name) return showToast('Please enter guest name', 'error');
        if (!roomId) return showToast('No vacant room selected', 'error');
        if (!checkIn) return showToast('Please pick check‑in date', 'error');

        const room = rooms.find(r => r.id == roomId);
        if (!room || room.is_occupied) return showToast('Room is no longer vacant', 'error');

        setLoading(true);
        try {
            const { error: guestErr } = await supabase.from('guests').insert({
                name,
                room_id: Number(roomId),
                check_in: checkIn,
                amount_paid: amount,
                still_lodging: true
            });
            if (guestErr) throw guestErr;

            const { error: roomErr } = await supabase
                .from('rooms')
                .update({ is_occupied: true })
                .eq('id', Number(roomId));
            if (roomErr) throw roomErr;

            document.getElementById('guestNameInput').value = '';
            document.getElementById('amountPaidInput').value = '500';

            showToast('✅ Guest checked in!');
            await loadAll();
        } catch (err) {
            console.error(err);
            showToast('❌ ' + err.message, 'error');
        } finally {
            setLoading(false);
        }
    };

    window.checkoutGuest = async function(guestId) {
        if (!supabase) return;
        if (!confirm('Check out this guest?')) return;

        const guest = guests.find(g => g.id === guestId);
        if (!guest) return;

        setLoading(true);
        try {
            const { error: gErr } = await supabase
                .from('guests')
                .update({ still_lodging: false, check_out: today() })
                .eq('id', guestId);
            if (gErr) throw gErr;

            if (guest.room_id) {
                const { error: rErr } = await supabase
                    .from('rooms')
                    .update({ is_occupied: false })
                    .eq('id', guest.room_id);
                if (rErr) throw rErr;
            }

            showToast('✅ Guest checked out');
            await loadAll();
        } catch (err) {
            console.error(err);
            showToast('❌ ' + err.message, 'error');
        } finally {
            setLoading(false);
        }
    };

    window.markAllCheckedOut = async function() {
        if (!supabase) return;
        const active = guests.filter(g => g.still_lodging);
        if (!active.length) return showToast('No active guests', 'error');
        if (!confirm(`Check out all ${active.length} guest(s)?`)) return;

        setLoading(true);
        try {
            const { error: gErr } = await supabase
                .from('guests')
                .update({ still_lodging: false, check_out: today() })
                .eq('still_lodging', true);
            if (gErr) throw gErr;

            const { error: rErr } = await supabase
                .from('rooms')
                .update({ is_occupied: false })
                .eq('is_occupied', true);
            if (rErr) throw rErr;

            showToast('✅ All guests checked out');
            await loadAll();
        } catch (err) {
            console.error(err);
            showToast('❌ ' + err.message, 'error');
        } finally {
            setLoading(false);
        }
    };

    window.showConfigHelp = function() {
        alert(
            'ChiEdgars Lodge · Setup\n\n' +
            '1. Create a project at supabase.com\n' +
            '2. Run the SQL schema below in SQL Editor\n' +
            '3. Copy your Project URL and anon key\n' +
            '4. In index.html, find the script block with\n' +
            '   SUPABASE_URL and SUPABASE_ANON_KEY and paste them.\n\n' +
            '5. Push to GitHub → deploy on Vercel.\n\n' +
            '=== SQL SCHEMA ===\n\n' +
            "create table rooms (\n" +
            "  id bigint generated always as identity primary key,\n" +
            "  name text not null,\n" +
            "  capacity int default 2,\n" +
            "  is_occupied boolean default false\n" +
            ");\n\n" +
            "create table guests (\n" +
            "  id bigint generated always as identity primary key,\n" +
            "  name text not null,\n" +
            "  room_id bigint references rooms(id),\n" +
            "  check_in date not null,\n" +
            "  check_out date,\n" +
            "  amount_paid numeric default 0,\n" +
            "  still_lodging boolean default true,\n" +
            "  created_at timestamptz default now()\n" +
            ");\n\n" +
            "insert into rooms (name, capacity)\n" +
            "select 'Room ' || i, 2\n" +
            "from generate_series(1, 30) as i;\n\n" +
            'alter table rooms enable row level security;\n' +
            'alter table guests enable row level security;\n\n' +
            'create policy "public read rooms" on rooms for select using (true);\n' +
            'create policy "public read guests" on guests for select using (true);\n' +
            'create policy "public insert guests" on guests for insert with check (true);\n' +
            'create policy "public update guests" on guests for update using (true);\n' +
            'create policy "public update rooms" on rooms for update using (true);'
        );
    };

    // ---------- BOOT ----------
    document.addEventListener('DOMContentLoaded', () => {
        const opts = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
        document.getElementById('currentDate').textContent =
            new Date().toLocaleDateString('en-GB', opts);

        document.getElementById('checkInDate').value = today();

        if (initSupabase()) {
            loadAll();
        }

        document.getElementById('addGuestBtn').addEventListener('click', addGuest);
    });
})();
</script>
