<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChiEdgars Lodge · Kasama</title>
    <link rel="icon" type="image/jpeg" href="imgs/logo.jpg">
    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Cool, high-standard color palette */
            --bg-body: #F4F7FB;
            --surface: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            
            --primary: #4F46E5;
            --primary-light: #EEF2FF;
            --success: #10B981;
            --success-light: #ECFDF5;
            --warning: #F59E0B;
            --warning-light: #FFFBEB;
            --danger: #EF4444;
            --danger-light: #FEF2F2;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard { max-width: 1400px; margin: 0 auto; }
        .hidden { display: none !important; }

        /* ============================================================ */
        /* CLEAN TOP HEADER                                             */
        /* ============================================================ */
        .topbar {
            background: var(--surface);
            border-radius: 20px;
            padding: 20px 28px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .brand { display: flex; align-items: center; gap: 16px; }
        
        .brand-logo {
            width: 54px; height: 54px;
            border-radius: 14px;
            background: var(--bg-body);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
        
        .brand-text h1 {
            font-size: 22px; font-weight: 800;
            letter-spacing: -0.5px;
            display: flex; align-items: center; gap: 10px;
            color: var(--text-main);
        }
        
        .brand-text .pin {
            font-size: 11px; font-weight: 700;
            background: var(--primary-light); color: var(--primary);
            padding: 4px 10px; border-radius: 20px;
            letter-spacing: 0.3px;
            display: inline-flex; align-items: center; gap: 4px;
        }

        .brand-text .tagline {
            color: var(--text-muted); font-size: 13px;
            margin-top: 4px; font-weight: 500;
            display: flex; align-items: center; gap: 8px;
        }

        .top-actions { display: flex; gap: 12px; }

        .btn {
            background: var(--surface); color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 18px; border-radius: 10px;
            font-weight: 600; font-size: 13px; font-family: inherit;
            display: inline-flex; align-items: center; gap: 8px;
            cursor: pointer; transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }
        .btn:hover { background: var(--bg-body); }
        
        .btn-primary {
            background: var(--text-main); color: white;
            border-color: var(--text-main);
        }
        .btn-primary:hover { background: #1E293B; }

        /* ============================================================ */
        /* STATS GRID                                                   */
        /* ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px; margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            border-radius: 20px; padding: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex; align-items: center; justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

        .stat-info h3 {
            font-size: 13px; font-weight: 600; color: var(--text-muted);
            margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 32px; font-weight: 800; color: var(--text-main);
            line-height: 1; letter-spacing: -1px;
        }
        .stat-value small { font-size: 16px; font-weight: 600; color: var(--text-muted); letter-spacing: 0; }

        .stat-icon {
            width: 52px; height: 52px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        .ic-blue { background: var(--primary-light); color: var(--primary); }
        .ic-green { background: var(--success-light); color: var(--success); }
        .ic-orange { background: var(--warning-light); color: var(--warning); }
        .ic-purple { background: #F3E8FF; color: #9333EA; }

        /* ============================================================ */
        /* MAIN LAYOUT                                                  */
        /* ============================================================ */
        .main-panel { display: flex; gap: 24px; flex-wrap: wrap; }
        .left-section { flex: 2.2; min-width: 320px; }
        .right-section { flex: 1.1; min-width: 300px; }

        .card {
            background: var(--surface); border-radius: 20px;
            padding: 24px; border: 1px solid var(--border);
            box-shadow: var(--shadow-sm); margin-bottom: 24px;
        }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        
        .card-title { display: flex; align-items: center; gap: 12px; }
        .card-title-icon {
            width: 36px; height: 36px; border-radius: 10px;
            background: var(--bg-body); color: var(--text-main);
            display: flex; align-items: center; justify-content: center; font-size: 15px;
        }
        .card-title h2 { font-size: 16px; font-weight: 700; color: var(--text-main); }
        
        .chip {
            background: var(--bg-body); color: var(--text-muted);
            font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px;
        }
        .chip.live {
            background: var(--success-light); color: var(--success);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .chip.live::before {
            content: ''; width: 6px; height: 6px; background: var(--success);
            border-radius: 50%; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        /* ============================================================ */
        /* TABLE                                                        */
        /* ============================================================ */
        .table-wrap { overflow-x: auto; margin: 0 -24px; padding: 0 24px; }
        .guest-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        
        .guest-table th {
            text-align: left; padding: 12px 16px;
            font-weight: 600; color: var(--text-muted);
            font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }
        .guest-table th:first-child { padding-left: 0; }
        .guest-table th:last-child { padding-right: 0; text-align: right; }
        
        .guest-table td {
            padding: 16px; border-bottom: 1px solid var(--border);
            color: var(--text-main); font-weight: 500; vertical-align: middle;
        }
        .guest-table td:first-child { padding-left: 0; }
        .guest-table td:last-child { padding-right: 0; text-align: right; }
        .guest-table tr:last-child td { border-bottom: none; }

        .guest-cell { display: flex; align-items: center; gap: 14px; }
        
        .avatar {
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px; color: white; flex-shrink: 0;
        }
        .avatar.a0 { background: #6366F1; }
        .avatar.a1 { background: #10B981; }
        .avatar.a2 { background: #F59E0B; }
        .avatar.a3 { background: #EC4899; }
        .avatar.a4 { background: #06B6D4; }
        .avatar.a5 { background: #8B5CF6; }

        .guest-name { font-weight: 700; color: var(--text-main); }
        .guest-room { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--success-light); color: var(--success);
            font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px;
        }
        .status-badge.checked-out { background: var(--bg-body); color: var(--text-muted); }

        .amount { font-weight: 800; font-size: 14px; color: var(--text-main); }

        .btn-icon {
            width: 34px; height: 34px; background: var(--bg-body); border: none;
            color: var(--text-muted); border-radius: 10px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .btn-icon:hover { background: var(--danger-light); color: var(--danger); }

        /* ============================================================ */
        /* ROOMS GRID                                                   */
        /* ============================================================ */
        .rooms-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px; max-height: 480px; overflow-y: auto; padding-right: 4px;
        }
        
        .rooms-grid::-webkit-scrollbar { width: 4px; }
        .rooms-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .room-item {
            border-radius: 16px; padding: 14px 12px;
            display: flex; flex-direction: column; gap: 10px;
            border: 1px solid var(--border); background: var(--surface);
            transition: 0.2s;
        }
        .room-item:hover { box-shadow: var(--shadow-md); }
        .room-item.vacant { border-left: 4px solid var(--success); }
        .room-item.occupied { border-left: 4px solid var(--warning); }

        .room-top { display: flex; align-items: center; justify-content: space-between; }
        .room-num { font-weight: 800; font-size: 15px; color: var(--text-main); }
        .room-dot { width: 8px; height: 8px; border-radius: 50%; }
        .vacant .room-dot { background: var(--success); }
        .occupied .room-dot { background: var(--warning); }

        .room-guest {
            display: flex; align-items: center; gap: 6px; font-size: 12px;
            font-weight: 600; color: var(--text-muted); min-height: 18px;
        }
        .room-mini-avatar {
            width: 20px; height: 20px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 800; color: white;
        }

        .room-status-label {
            font-size: 11px; font-weight: 700; padding: 4px 0; border-radius: 8px; text-align: center;
        }
        .vacant .room-status-label { background: var(--success-light); color: var(--success); }
        .occupied .room-status-label { background: var(--warning-light); color: var(--warning); }

        .room-legend {
            display: flex; gap: 16px; margin-top: 16px; padding-top: 16px;
            border-top: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text-muted);
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
        .legend-dot.green { background: var(--success); }
        .legend-dot.orange { background: var(--warning); }

        /* ============================================================ */
        /* FORMS & QUICK ACTIONS                                        */
        /* ============================================================ */
        .add-guest-form { display: flex; flex-direction: column; gap: 16px; }
        .form-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 140px; }
        
        .form-group label {
            font-size: 12px; font-weight: 700; color: var(--text-main);
            margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
        }
        .form-group label i { color: var(--primary); }

        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 14px; pointer-events: none;
        }
        
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px 12px 40px;
            border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg-body); font-size: 14px; font-family: inherit;
            font-weight: 600; color: var(--text-main); outline: none; transition: 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary); background: var(--surface);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        
        .btn-add {
            background: var(--primary); color: white; border: none;
            padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px;
            font-family: inherit; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 4px;
        }
        .btn-add:hover { background: #4338CA; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }

        .quick-actions { display: flex; flex-direction: column; gap: 12px; }
        .action-btn {
            display: flex; align-items: center; gap: 14px; background: var(--surface);
            border: 1px solid var(--border); padding: 16px; border-radius: 14px;
            font-family: inherit; text-align: left; cursor: pointer; transition: 0.2s;
            width: 100%;
        }
        .action-btn:hover { border-color: var(--primary); background: var(--bg-body); }
        
        .action-icon {
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: white; flex-shrink: 0;
        }
        .ai-red { background: var(--danger); }
        .ai-blue { background: var(--primary); }

        .action-text { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .action-text small { display: block; font-size: 12px; color: var(--text-muted); font-weight: 500; margin-top: 2px; }

        /* ============================================================ */
        /* UTILITIES                                                    */
        /* ============================================================ */
        #toast {
            position: fixed; bottom: 30px; right: 30px; background: var(--text-main); color: white;
            padding: 16px 24px; border-radius: 12px; font-size: 14px; font-weight: 600;
            font-family: inherit; box-shadow: var(--shadow-lg); transform: translateY(200%);
            transition: transform 0.3s cubic-bezier(.2,.9,.3,1.3); z-index: 999;
        }
        #toast.show { transform: translateY(0); }
        #toast.error { background: var(--danger); }
        #toast.success { background: var(--success); }

        .loading-overlay {
            position: fixed; inset: 0; background: rgba(244, 247, 251, 0.8);
            backdrop-filter: blur(4px); display: flex; align-items: center;
            justify-content: center; z-index: 998; font-size: 32px; color: var(--primary);
        }

        .empty-msg {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 24px; background: var(--bg-body); color: var(--text-muted);
            border-radius: 12px; font-size: 14px; font-weight: 600;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            body { padding: 16px; }
            .topbar { flex-direction: column; align-items: flex-start; padding: 20px; }
            .top-actions { width: 100%; justify-content: flex-start; }
            .stat-card { padding: 20px; }
            .guest-table th, .guest-table td { padding: 12px 8px; }
            .table-wrap { margin: 0 -20px; padding: 0 20px; }
            .btn span { display: none; }
            .btn { padding: 10px; }
        }
    </style>
</head>
<body>

<div id="appScreen" class="dashboard">
    
    <!-- Clean Header -->
    <div class="topbar">
        <div class="brand">
            <div class="brand-logo">
                <img src="imgs/logo.jpg" alt="Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'fas fa-hotel\' style=\'color:var(--primary)\'></i>'">
            </div>
            <div class="brand-text">
                <h1>
                    ChiEdgars Lodge
                    <span class="pin"><i class="fas fa-map-pin"></i> Kasama</span>
                </h1>
                <div class="tagline">
                    <span id="currentDate"></span>
                    <span>•</span>
                    <span style="color: var(--success); display: flex; align-items: center; gap: 4px;">
                        <i class="fas fa-circle" style="font-size: 8px;"></i> Online
                    </span>
                </div>
            </div>
        </div>
        <div class="top-actions">
            <button class="btn btn-primary" onclick="loadAll()">
                <i class="fas fa-rotate"></i> <span>Refresh Data</span>
            </button>
        </div>
    </div>

    <!-- Stats Overview -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- Main Content -->
    <div class="main-panel">
        
        <!-- Left Column -->
        <div class="left-section">
            <!-- Guest Table -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <div class="card-title-icon"><i class="fas fa-users"></i></div>
                        <h2>Guests & Stays</h2>
                    </div>
                    <span class="chip live" id="guestCountBadge">0 Active</span>
                </div>
                <div class="table-wrap">
                    <table class="guest-table">
                        <thead>
                            <tr>
                                <th>Guest</th>
                                <th>Lodge In</th>
                                <th>Lodge Out</th>
                                <th>Status</th>
                                <th>Amount</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="guestTableBody"></tbody>
                    </table>
                </div>
                <div class="empty-msg" id="emptyGuestMsg" style="display:none;">
                    <i class="fas fa-bed"></i> No guests currently checked in.
                </div>
            </div>

            <!-- New Guest Form -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <div class="card-title-icon"><i class="fas fa-user-plus"></i></div>
                        <h2>New Guest Check-In</h2>
                    </div>
                </div>
                <div class="add-guest-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Guest Full Name</label>
                            <div class="input-wrap">
                                <i class="fas fa-user"></i>
                                <input type="text" id="guestNameInput" placeholder="e.g. Chanda Mwila">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Assign Room</label>
                            <div class="input-wrap">
                                <i class="fas fa-door-closed"></i>
                                <select id="roomSelect"></select>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Check-In Date</label>
                            <div class="input-wrap">
                                <i class="fas fa-calendar"></i>
                                <input type="date" id="checkInDate">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Amount Paid (ZMW)</label>
                            <div class="input-wrap">
                                <i class="fas fa-money-bill-wave"></i>
                                <input type="number" id="amountPaidInput" placeholder="0.00" min="0" step="10" value="500">
                            </div>
                        </div>
                    </div>
                    <button class="btn-add" id="addGuestBtn">
                        <i class="fas fa-check-circle"></i> Confirm Check-In
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="right-section">
            <!-- Rooms Overview -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <div class="card-title-icon"><i class="fas fa-door-open"></i></div>
                        <h2>Room Status</h2>
                    </div>
                    <span class="chip" id="roomSummaryBadge">0 Vacant</span>
                </div>
                <div class="rooms-grid" id="roomsGrid"></div>
                <div class="room-legend">
                    <span class="legend-item"><span class="legend-dot green"></span> Vacant</span>
                    <span class="legend-item"><span class="legend-dot orange"></span> Occupied</span>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <div class="card-title-icon"><i class="fas fa-bolt"></i></div>
                        <h2>Quick Actions</h2>
                    </div>
                </div>
                <div class="quick-actions">
                    <button class="action-btn" onclick="markAllCheckedOut()">
                        <span class="action-icon ai-red"><i class="fas fa-right-from-bracket"></i></span>
                        <span class="action-text">
                            Check-out all guests
                            <small>Instantly free all occupied rooms</small>
                        </span>
                    </button>
                    <button class="action-btn" onclick="loadAll()">
                        <span class="action-icon ai-blue"><i class="fas fa-arrows-rotate"></i></span>
                        <span class="action-text">
                            Sync Database
                            <small>Fetch latest records from Supabase</small>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>
<div id="loading" class="loading-overlay hidden"><i class="fas fa-spinner fa-spin"></i></div>

<script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function() {
    'use strict';

    let supabase = null;
    let rooms = [];
    let guests = [];

    function initSupabase() {
        if (SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_ANON_KEY.includes('YOUR-ANON')) {
            showToast('⚠️ Add your Supabase URL and key first', 'error', 8000);
            return false;
        }
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        return true;
    }

    function showToast(msg, type = 'success', duration = 3000) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'show ' + (type === 'error' ? 'error' : 'success');
        setTimeout(() => { el.className = ''; }, duration);
    }

    function setLoading(on) {
        document.getElementById('loading').classList.toggle('hidden', !on);
    }

    function formatDate(date) {
        if (!date) return '';
        const d = new Date(date);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }
    function today() { return formatDate(new Date()); }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function initials(name) {
        if (!name) return '?';
        const parts = name.trim().split(/\s+/);
        return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
    }
    
    function colorFor(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 6;
        return 'a' + h;
    }

    async function loadAll() {
        if (!supabase && !initSupabase()) return;
        setLoading(true);
        try {
            const [roomsRes, guestsRes] = await Promise.all([
                supabase.from('rooms').select('*').order('id'),
                supabase.from('guests').select('*').order('created_at', { ascending: false })
            ]);
            
            if (roomsRes.error) throw roomsRes.error;
            if (guestsRes.error) throw guestsRes.error;
            
            rooms = roomsRes.data || [];
            guests = guestsRes.data || [];
            renderAll();
        } catch (err) {
            console.error(err);
            showToast('❌ Failed to load: ' + err.message, 'error', 5000);
        } finally {
            setLoading(false);
        }
    }

    function renderAll() {
        renderStats();
        renderGuestTable();
        renderRooms();
        renderRoomSelect();
        updateBadges();
    }

    function renderStats() {
        const active = guests.filter(g => g.still_lodging).length;
        const totalPaid = guests.reduce((s, g) => s + (Number(g.amount_paid) || 0), 0);
        const vacant = rooms.filter(r => !r.is_occupied).length;
        const occupied = rooms.length - vacant;
        const rate = rooms.length ? Math.round((occupied / rooms.length) * 100) : 0;

        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Guests In House</h3>
                    <div class="stat-value">${active}</div>
                </div>
                <div class="stat-icon ic-blue"><i class="fas fa-user-check"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Total Revenue</h3>
                    <div class="stat-value">ZMW ${totalPaid.toLocaleString()}</div>
                </div>
                <div class="stat-icon ic-green"><i class="fas fa-coins"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Vacant Rooms</h3>
                    <div class="stat-value">${vacant}<small> / ${rooms.length}</small></div>
                </div>
                <div class="stat-icon ic-orange"><i class="fas fa-door-closed"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Occupancy Rate</h3>
                    <div class="stat-value">${rate}%</div>
                </div>
                <div class="stat-icon ic-purple"><i class="fas fa-chart-pie"></i></div>
            </div>
        `;
    }

    function renderGuestTable() {
        const tbody = document.getElementById('guestTableBody');
        const emptyMsg = document.getElementById('emptyGuestMsg');
        
        if (!guests.length) {
            tbody.innerHTML = '';
            emptyMsg.style.display = 'flex';
            return;
        }
        emptyMsg.style.display = 'none';

        const sorted = [...guests].sort((a, b) => {
            if (a.still_lodging === b.still_lodging) return 0;
            return a.still_lodging ? -1 : 1;
        });

        tbody.innerHTML = sorted.map(g => {
            const room = rooms.find(r => r.id === g.room_id);
            const roomName = room ? room.name : '—';
            const statusClass = g.still_lodging ? 'status-badge' : 'status-badge checked-out';
            const statusText = g.still_lodging ? 'Lodging' : 'Checked out';
            const av = colorFor(g.name || 'x');
            
            return `<tr>
                <td>
                    <div class="guest-cell">
                        <div class="avatar ${av}">${initials(g.name)}</div>
                        <div>
                            <div class="guest-name">${escapeHtml(g.name)}</div>
                            <div class="guest-room">${roomName}</div>
                        </div>
                    </div>
                </td>
                <td>${g.check_in || '—'}</td>
                <td>${g.check_out || '—'}</td>
                <td><span class="${statusClass}">${statusText}</span></td>
                <td class="amount">${Number(g.amount_paid).toLocaleString()}</td>
                <td>
                    ${g.still_lodging ? `<button class="btn-icon" onclick="checkoutGuest(${g.id})" title="Check out"><i class="fas fa-arrow-right-from-bracket"></i></button>` : ''}
                </td>
            </tr>`;
        }).join('');
    }

    function renderRooms() {
        const grid = document.getElementById('roomsGrid');
        if (!rooms.length) {
            grid.innerHTML = '<div class="empty-msg" style="grid-column:1/-1;">No rooms configured.</div>';
            return;
        }
        
        grid.innerHTML = rooms.map(room => {
            const occ = room.is_occupied;
            const occupant = occ ? guests.find(g => g.room_id === room.id && g.still_lodging) : null;
            const av = occupant ? colorFor(occupant.name || 'x') : null;
            
            const guestLine = occupant
                ? `<div class="room-mini-avatar ${av}">${initials(occupant.name)}</div><span>${escapeHtml(occupant.name.split(' ')[0])}</span>`
                : `<span style="opacity:.5;">Available</span>`;
                
            return `<div class="room-item ${occ ? 'occupied' : 'vacant'}">
                <div class="room-top">
                    <span class="room-num">${escapeHtml(room.name.replace('Room ',''))}</span>
                    <span class="room-dot"></span>
                </div>
                <div class="room-guest">${guestLine}</div>
                <div class="room-status-label">${occ ? 'Occupied' : 'Vacant'}</div>
            </div>`;
        }).join('');
        
        const vacant = rooms.filter(r => !r.is_occupied).length;
        document.getElementById('roomSummaryBadge').textContent = `${vacant} Vacant`;
    }

    function renderRoomSelect() {
        const select = document.getElementById('roomSelect');
        const vacant = rooms.filter(r => !r.is_occupied);
        if (!vacant.length) {
            select.innerHTML = '<option value="">No rooms available</option>';
            select.disabled = true;
            return;
        }
        select.disabled = false;
        select.innerHTML = vacant.sort((a, b) => a.id - b.id)
            .map(r => `<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('');
    }

    function updateBadges() {
        const active = guests.filter(g => g.still_lodging).length;
        document.getElementById('guestCountBadge').textContent = `${active} Active`;
    }

    window.addGuest = async function() {
        if (!supabase) return;
        const name = document.getElementById('guestNameInput').value.trim();
        const roomId = document.getElementById('roomSelect').value;
        const checkIn = document.getElementById('checkInDate').value;
        const amount = parseFloat(document.getElementById('amountPaidInput').value) || 0;

        if (!name) return showToast('Please enter guest name', 'error');
        if (!roomId) return showToast('No vacant room selected', 'error');
        if (!checkIn) return showToast('Please pick check‑in date', 'error');

        const room = rooms.find(r => r.id == roomId);
        if (!room || room.is_occupied) return showToast('Room is no longer vacant', 'error');

        setLoading(true);
        try {
            const { error: e1 } = await supabase.from('guests').insert({
                name, room_id: Number(roomId), check_in: checkIn,
                amount_paid: amount, still_lodging: true
            });
            if (e1) throw e1;

            const { error: e2 } = await supabase
                .from('rooms').update({ is_occupied: true }).eq('id', Number(roomId));
            if (e2) throw e2;

            document.getElementById('guestNameInput').value = '';
            document.getElementById('amountPaidInput').value = '500';
            showToast('✅ Guest checked in!');
            await loadAll();
        } catch (err) {
            console.error(err);
            showToast('❌ ' + err.message, 'error');
        } finally {
            setLoading(false);
        }
    };

    window.checkoutGuest = async function(guestId) {
        if (!supabase) return;
        if (!confirm('Check out this guest?')) return;
        const guest = guests.find(g => g.id === guestId);
        if (!guest) return;

        setLoading(true);
        try {
            const { error: e1 } = await supabase.from('guests')
                .update({ still_lodging: false, check_out: today() }).eq('id', guestId);
            if (e1) throw e1;

            if (guest.room_id) {
                const { error: e2 } = await supabase.from('rooms')
                    .update({ is_occupied: false }).eq('id', guest.room_id);
                if (e2) throw e2;
            }
            showToast('✅ Guest checked out');
            await loadAll();
        } catch (err) {
            console.error(err);
            showToast('❌ ' + err.message, 'error');
        } finally {
            setLoading(false);
        }
    };

    window.markAllCheckedOut = async function() {
        if (!supabase) return;
        const active = guests.filter(g => g.still_lodging);
        if (!active.length) return showToast('No active guests', 'error');
        if (!confirm(`Check out all ${active.length} guest(s)?`)) return;

        setLoading(true);
        try {
            const { error: e1 } = await supabase.from('guests')
                .update({ still_lodging: false, check_out: today() }).eq('still_lodging', true);
            if (e1) throw e1;

            const { error: e2 } = await supabase.from('rooms')
                .update({ is_occupied: false }).eq('is_occupied', true);
            if (e2) throw e2;

            showToast('✅ All guests checked out');
            await loadAll();
        } catch (err) {
            console.error(err);
            showToast('❌ ' + err.message, 'error');
        } finally {
            setLoading(false);
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        const opts = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-GB', opts);
        document.getElementById('checkInDate').value = today();

        document.getElementById('addGuestBtn').addEventListener('click', addGuest);

        if (initSupabase()) {
            loadAll();
        }
    });
})();
</script>
</body>
</html>
